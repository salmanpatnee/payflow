openapi: 3.0.0
info:
  title: PayFlow API
  description: API for the PayFlow payment collection system
  version: 1.0.0
  contact:
    name: PayFlow Support
    email: support@payflow.example

servers:
  - url: http://localhost:8000/api
    description: Development server
  - url: https://payflow.example.com/api
    description: Production server

paths:
  /auth/login:
    post:
      summary: Admin login
      description: Authenticate admin user and return session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: admin@example.com
                password:
                  type: string
                  format: password
                  example: password
              required:
                - email
                - password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successful
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid credentials

  /auth/logout:
    post:
      summary: Admin logout
      description: Logout admin user and invalidate session
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logout successful

  /dashboard:
    get:
      summary: Admin dashboard
      description: Get dashboard data for authenticated admin
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  stats:
                    type: object
                    properties:
                      total_collections:
                        type: integer
                        example: 15
                      active_collections:
                        type: integer
                        example: 5
                      pending_payments:
                        type: integer
                        example: 12
        '401':
          description: Unauthenticated

  /payment-collections:
    get:
      summary: List payment collections
      description: Get all payment collections for the authenticated admin
      responses:
        '200':
          description: List of payment collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentCollection'
        '401':
          description: Unauthenticated
    post:
      summary: Create payment collection
      description: Create a new payment collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCollectionCreateRequest'
      responses:
        '201':
          description: Payment collection created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCollection'
        '401':
          description: Unauthenticated
        '422':
          description: Validation error

  /payment-collections/{id}:
    get:
      summary: Get payment collection
      description: Get a specific payment collection by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Payment collection details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCollection'
        '401':
          description: Unauthenticated
        '404':
          description: Payment collection not found
    put:
      summary: Update payment collection
      description: Update a specific payment collection by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCollectionUpdateRequest'
      responses:
        '200':
          description: Payment collection updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCollection'
        '401':
          description: Unauthenticated
        '404':
          description: Payment collection not found
        '422':
          description: Validation error
    delete:
      summary: Delete payment collection
      description: Delete a specific payment collection by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Payment collection deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Payment collection deleted
        '401':
          description: Unauthenticated
        '404':
          description: Payment collection not found

  /pay/{uuid}:
    get:
      summary: Get payment collection for client
      description: Get payment collection details for client to make payments
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment collection details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCollectionPublic'
        '404':
          description: Payment collection not found
        '410':
          description: Payment collection expired

  /pay/{uuid}/payment-intent:
    post:
      summary: Create payment intent
      description: Create a Stripe payment intent for a specific payment item
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_item_id:
                  type: integer
                  example: 1
              required:
                - payment_item_id
      responses:
        '200':
          description: Payment intent created
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_secret:
                    type: string
                    example: pi_abc123_secret_def456
                  payment_intent_id:
                    type: string
                    example: pi_abc123
        '404':
          description: Payment collection or item not found
        '409':
          description: Payment collection not active

  /pay/{uuid}/confirm:
    post:
      summary: Confirm payment
      description: Confirm payment completion and update item status
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_intent_id:
                  type: string
                  example: pi_abc123
              required:
                - payment_intent_id
      responses:
        '200':
          description: Payment confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Payment confirmed
        '400':
          description: Invalid payment intent
        '404':
          description: Payment collection not found

components:
  schemas:
    PaymentCollection:
      type: object
      properties:
        id:
          type: integer
          example: 1
        uuid:
          type: string
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        title:
          type: string
          example: Project Payment Collection
        description:
          type: string
          example: Payment collection for project deliverables
        status:
          type: string
          enum: [active, completed, expired]
          example: active
        expires_at:
          type: string
          format: date-time
          example: "2023-12-31T23:59:59.000000Z"
        admin_user_id:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          example: "2023-01-01T12:00:00.000000Z"
        updated_at:
          type: string
          format: date-time
          example: "2023-01-01T12:00:00.000000Z"
        payment_items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentItem'
    
    PaymentCollectionPublic:
      type: object
      properties:
        uuid:
          type: string
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        title:
          type: string
          example: Project Payment Collection
        description:
          type: string
          example: Payment collection for project deliverables
        status:
          type: string
          enum: [active, completed, expired]
          example: active
        payment_items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentItemPublic'
    
    PaymentItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        description:
          type: string
          example: Website Design
        amount:
          type: number
          format: decimal
          example: 500.00
        status:
          type: string
          enum: [pending, processing, completed, failed]
          example: pending
        stripe_payment_intent_id:
          type: string
          nullable: true
          example: pi_abc123
        paid_at:
          type: string
          format: date-time
          nullable: true
          example: "2023-01-01T12:00:00.000000Z"
        created_at:
          type: string
          format: date-time
          example: "2023-01-01T12:00:00.000000Z"
        updated_at:
          type: string
          format: date-time
          example: "2023-01-01T12:00:00.000000Z"
    
    PaymentItemPublic:
      type: object
      properties:
        id:
          type: integer
          example: 1
        description:
          type: string
          example: Website Design
        amount:
          type: number
          format: decimal
          example: 500.00
        status:
          type: string
          enum: [pending, processing, completed, failed]
          example: pending
    
    PaymentCollectionCreateRequest:
      type: object
      properties:
        title:
          type: string
          example: Project Payment Collection
        description:
          type: string
          example: Payment collection for project deliverables
        expires_at:
          type: string
          format: date-time
          example: "2023-12-31T23:59:59.000000Z"
        payment_items:
          type: array
          items:
            type: object
            properties:
              description:
                type: string
                example: Website Design
              amount:
                type: number
                format: decimal
                example: 500.00
            required:
              - description
              - amount
      required:
        - title
        - payment_items
    
    PaymentCollectionUpdateRequest:
      type: object
      properties:
        title:
          type: string
          example: Updated Project Payment Collection
        description:
          type: string
          example: Updated payment collection for project deliverables
        expires_at:
          type: string
          format: date-time
          example: "2023-12-31T23:59:59.000000Z"