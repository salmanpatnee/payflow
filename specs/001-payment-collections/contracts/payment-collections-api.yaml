### 5. Delete Payment Collection
**DELETE** `/payment-collections/{id}`

**Description**: Delete a payment collection

**Request**:
- Headers: `Authorization: Bearer {token}` or session cookie
- Path Parameters:
  - `id`: ID of the payment collection

**Response**:
- Status: 204 No Content

## Error Responses

### Validation Error
**Status**: 422 Unprocessable Entity
```json
{
  "message": "The given data was invalid.",
  "errors": {
    "name": [
      "The name field is required."
    ],
    "items.0.price": [
      "The price must be a positive number."
    ]
  }
}
```

### Unauthorized Access
**Status**: 401 Unauthorized
```json
{
  "message": "Unauthenticated."
}
```

### Forbidden Access
**Status**: 403 Forbidden
```json
{
  "message": "This action is unauthorized."
}
```

### Resource Not Found
**Status**: 404 Not Found
```json
{
  "message": "Payment collection not found."
}
```

## Validation Rules

### Payment Collection
- `name`: Required, string, max:255
- `description`: Optional, string, max:65535

### Payment Items
- `name`: Required, string, max:255
- `description`: Optional, string, max:65535
- `price`: Required, numeric, positive
- `quantity`: Required, integer, positive
- `type`: Required, string, in:service,product,fee

## Access Control
- All endpoints require admin authentication
- Admin users can only access collections they own (when implemented)
- Soft deletes will be used to preserve audit trail