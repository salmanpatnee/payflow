# API Contract: Payment Collections Management

## Overview
This document defines the API contracts for payment collections management functionality, specifically for admin CRUD operations. These endpoints will be accessible only to authenticated admin users.

## Base URL
All endpoints are relative to the base API path: `/admin/api`

## Authentication
All endpoints require admin authentication using Laravel Sanctum tokens or session-based authentication.

## Endpoints

### 1. List Payment Collections
**GET** `/payment-collections`

**Description**: Retrieve a paginated list of all payment collections

**Request**:
- Headers: `Authorization: Bearer {token}` or session cookie
- Query Parameters:
  - `page` (optional): Page number for pagination (default: 1)
  - `per_page` (optional): Number of items per page (default: 15, max: 100)
  - `search` (optional): Search term to filter collections by name or description
  - `status` (optional): Filter by collection status (active, completed, expired)

**Response**:
- Status: 200 OK
- Body:
```json
{
  "data": [
    {
      "id": 1,
      "uuid": "a1b2c3d4-e5f6-7890-1234-567890abcdef",
      "name": "Q3 Marketing Package",
      "description": "Payment collection for Q3 marketing services",
      "status": "active",
      "created_at": "2024-12-29T10:30:00Z",
      "updated_at": "2024-12-29T10:30:00Z",
      "items_count": 3
    }
  ],
  "links": {
    "first": "/admin/api/payment-collections?page=1",
    "last": "/admin/api/payment-collections?page=10",
    "prev": null,
    "next": "/admin/api/payment-collections?page=2"
  },
  "meta": {
    "current_page": 1,
    "from": 1,
    "last_page": 10,
    "links": [...],
    "path": "/admin/api/payment-collections",
    "per_page": 15,
    "to": 15,
    "total": 150
  }
}
```

